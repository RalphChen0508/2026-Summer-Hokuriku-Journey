        function debounce(func, timeout = 1000){
            let timer;
            return (...args) => {
                clearTimeout(timer);
                updateStatus('saving');
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        const unsub = onSnapshot(doc(db, "trips", DOC_ID), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const isPending = docSnap.metadata.hasPendingWrites;
                if (isPending) return;

                ITINERARY_DATA = data.ITINERARY_DATA || [];
                OUTFIT_TIPS = data.OUTFIT_TIPS || [];
                DRIVE_TIPS = data.DRIVE_TIPS || [];
                budgetItems = data.budgetItems || [];
                
                renderAll();
                updateStatus('saved');
            } else {
                loadDefaultsLocal();
            }
        }, (error) => {
            console.error("Firestore Error:", error);
            updateStatus('error');
        });

        const saveToCloud = debounce(async () => {
            try {
                await setDoc(doc(db, "trips", DOC_ID), {
                    ITINERARY_DATA, OUTFIT_TIPS, DRIVE_TIPS, budgetItems
                }, { merge: true });
                updateStatus('saved');
            } catch (e) {
                console.error("Error adding document: ", e);
                updateStatus('error');
            }
        });

        function loadDefaultsLocal() {
            ITINERARY_DATA = DEFAULT_ITINERARY_DATA;
            OUTFIT_TIPS = DEFAULT_OUTFIT_TIPS;
            DRIVE_TIPS = DEFAULT_DRIVE_TIPS;
            budgetItems = DEFAULT_BUDGET_ITEMS;
            renderAll();
            const syncText = document.getElementById('sync-text');
            if (syncText) syncText.innerText = "預設模式 (編輯後才會同步)";
        }

        function updateStatus(status) {
            const el = document.getElementById('sync-status');
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            
            el.className = ''; 
            if (status === 'saved') {
                el.classList.add('status-saved');
                dot.className = 'w-2 h-2 rounded-full bg-green-500';
                text.innerText = '雲端已同步';
            } else if (status === 'saving') {
                el.classList.add('status-saving');
                dot.className = 'w-2 h-2 rounded-full bg-yellow-500 animate-pulse';
                text.innerText = '儲存中...';
            } else {
                el.classList.add('status-error');
                dot.className = 'w-2 h-2 rounded-full bg-red-500';
                text.innerText = '同步失敗';
            }
        }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`btn-${tabId}`).classList.add('active');
        }

        window.toggleAllDays = function() {
            const firstDay = document.getElementById('day-content-1');
            const isHidden = firstDay && firstDay.classList.contains('hidden');
            ITINERARY_DATA.forEach(day => {
                const el = document.getElementById(`day-content-${day.day}`);
                if(el) {
                    if(isHidden) el.classList.remove('hidden');
                    else el.classList.add('hidden');
                }
            });
            lucide.createIcons();
        }

            const el = document.getElementById(`day-content-${dayId}`);
            if(el) el.classList.toggle('hidden');

        window.updateDailyDetail = function(dayId, detailId, field, value) {
            const day = ITINERARY_DATA.find(d => d.day === dayId);
            const detail = day.details.find(d => d.id === detailId);
            if (detail) { detail[field] = value; saveToCloud(); }
        }

            const day = ITINERARY_DATA.find(d => d.day === dayId);
            day.details.push({ id: Date.now(), time: "00:00", action: "新行程", type: "activity", location: "" });

            renderDaily();
            const el = document.getElementById(`day-content-${dayId}`);
            if(el) el.classList.remove('hidden');
            lucide.createIcons();

        window.removeDailyDetail = function(dayId, detailId) {
            if(confirm('刪除此行程？')) {
                const day = ITINERARY_DATA.find(d => d.day === dayId);
                day.details = day.details.filter(d => d.id !== detailId);
                saveToCloud();
                renderDaily();
                const el = document.getElementById(`day-content-${dayId}`);
                if(el) el.classList.remove('hidden');

        window.updateBudget = function(id, field, value) {
            const idx = budgetItems.findIndex(i => i.id === id);
            if(idx !== -1) {
                budgetItems[idx][field] = field === 'amount' ? Number(value) : value;
                saveToCloud();
                if(field === 'amount') {
                     const total = budgetItems.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                     const totalEl = document.getElementById('budget-total');
                     if(totalEl) totalEl.innerText = 'NT$ ' + total.toLocaleString();
                }
            }
        }

            if(!container) return;
            container.innerHTML = Object.entries(MAP_CODES).map(([name, code]) => `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white p-3 rounded shadow-sm border border-gray-100 gap-2">
                    <button onclick="openGoogleMaps('${name}')" class="font-medium text-teal-600 hover:text-teal-800 flex items-center gap-1 transition-colors text-left"><i data-lucide="map-pin" width="16"></i> ${name}</button>
                    <code class="bg-gray-100 px-2 py-1 rounded text-gray-600 font-mono select-all cursor-pointer hover:bg-gray-200 text-xs sm:text-sm whitespace-nowrap">${code}</code>
                </div>
            `).join('');
        }

        function renderBudget() {
            const tbody = document.getElementById('budget-tbody');
            if(!tbody) return;
            tbody.innerHTML = budgetItems.map(item => `
                <tr class="border-b border-gray-100 hover:bg-gray-50 group transition-colors">
                    <td class="py-2 pl-2"><input type="text" value="${item.category}" onchange="updateBudget(${item.id}, 'category', this.value)" class="w-full bg-transparent focus:outline-none focus:ring-1 focus:ring-teal-300 rounded px-1 py-1"></td>
                    <td class="py-2"><input type="number" value="${item.amount}" onchange="updateBudget(${item.id}, 'amount', this.value)" class="w-full bg-transparent font-mono text-right focus:outline-none focus:ring-1 focus:ring-teal-300 rounded px-1 py-1"></td>
                    <td class="py-2 text-gray-500 text-sm"><input type="text" value="${item.note}" onchange="updateBudget(${item.id}, 'note', this.value)" class="w-full bg-transparent focus:outline-none focus:ring-1 focus:ring-teal-300 rounded px-1 py-1"></td>
                    <td class="py-2 text-center"><button onclick="removeBudget(${item.id})" class="text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity px-2">×</button></td>
                </tr>
            `).join('');
            const total = budgetItems.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
            document.getElementById('budget-total').innerText = 'NT$ ' + total.toLocaleString();
        }

        function renderAdvisories() {
            const outfitList = document.getElementById('outfit-list');
            const driveList = document.getElementById('drive-list');
            
            if(outfitList) outfitList.innerHTML = OUTFIT_TIPS.map(item => `<li class="flex gap-2 group"><span class="text-orange-400 font-bold shrink-0">•</span><span contenteditable="true" onblur="updateAdvisory('outfit', ${item.id}, this.innerHTML)" class="flex-1 border-b border-dashed border-transparent hover:border-gray-300">${item.text}</span><button onclick="removeAdvisory('outfit', ${item.id})" class="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-500 transition-opacity px-1">×</button></li>`).join('');
            if(driveList) driveList.innerHTML = DRIVE_TIPS.map(item => `<li class="flex gap-2 group"><span class="text-teal-500 font-bold shrink-0">•</span><span contenteditable="true" onblur="updateAdvisory('drive', ${item.id}, this.innerHTML)" class="flex-1 border-b border-dashed border-transparent hover:border-gray-300">${item.text}</span><button onclick="removeAdvisory('drive', ${item.id})" class="opacity-0 group-hover:opacity-100 text-gray-300 hover:text-red-500 transition-opacity px-1">×</button></li>`).join('');
        }

        function initChart() {
            const ctx = document.getElementById('tempChart');
            if(!ctx) return;
            new Chart(ctx.getContext('2d'), { 
                type: 'line', 
                data: { 
                    labels: ['早晨', '中午', '傍晚', '深夜'], 
                    datasets: [
                        { label: '名古屋市區 (Nagoya)', data: [25, 35, 29, 26], borderColor: '#f97316', backgroundColor: '#f97316' }, 
                        { label: '新穗高/上高地 (Mountains)', data: [15, 22, 18, 12], borderColor: '#0f766e', backgroundColor: '#0f766e' }
                    ] 
                }, 
                options: { responsive: true, maintainAspectRatio: false } 
            });
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMapCodes();
            lucide.createIcons();
            initChart();
        });
    </script>
</body>
</html>
