        function debounce(func, timeout = 1000){
            let timer;
            return (...args) => {
                if(!isEditor) return; // Viewer 不能寫入
                clearTimeout(timer);
                updateStatus('saving');
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }

        const unsub = onSnapshot(doc(db, "trips", DOC_ID), (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (docSnap.metadata.hasPendingWrites) return; // 忽略本地尚未同步的快照 (防游標跳動)

                ITINERARY_DATA = data.ITINERARY_DATA || [];
                OUTFIT_TIPS = data.OUTFIT_TIPS || [];
                DRIVE_TIPS = data.DRIVE_TIPS || [];
                budgetItems = data.budgetItems || [];
                
                renderAll();
                updateStatus('saved');
            } else {
                loadDefaultsLocal();
            }
        }, (error) => {
            console.error("Firestore Error:", error);
            updateStatus('error');
        });

        const saveToCloud = debounce(async () => {
            if(!isEditor) return;
            try {
                await setDoc(doc(db, "trips", DOC_ID), {
                    ITINERARY_DATA, OUTFIT_TIPS, DRIVE_TIPS, budgetItems
                }, { merge: true });
                updateStatus('saved');
            } catch (e) {
                console.error("Error adding document: ", e);
                updateStatus('error');
            }
        });

        function loadDefaultsLocal() {
            ITINERARY_DATA = DEFAULT_ITINERARY_DATA;
            OUTFIT_TIPS = DEFAULT_OUTFIT_TIPS;
            DRIVE_TIPS = DEFAULT_DRIVE_TIPS;
            budgetItems = DEFAULT_BUDGET_ITEMS;
            renderAll();
            document.getElementById('sync-text').innerText = "載入預設資料";
        }

        function updateStatus(status) {
            const dot = document.getElementById('sync-dot');
            const text = document.getElementById('sync-text');
            if (status === 'saved') {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500';
                text.innerText = isEditor ? '雲端已同步' : '即時檢視中';
            } else if (status === 'saving') {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
                text.innerText = '儲存中...';
            } else {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500';
                text.innerText = '離線/失敗';
            }
        }

            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`btn-${tabId}`).classList.add('active');
        }

            const isHidden = firstDay && firstDay.classList.contains('hidden');
            ITINERARY_DATA.forEach(day => {
                const el = document.getElementById(`day-content-${day.day}`);
                if(el) isHidden ? el.classList.remove('hidden') : el.classList.add('hidden');
            });
            lucide.createIcons();
        }

        // Data Mutators (Guarded by isEditor inside saveToCloud)
        window.updateDailyDetail = function(dayId, detailId, field, value) {
            if(!isEditor) return;
            const detail = ITINERARY_DATA.find(d => d.day === dayId)?.details.find(d => d.id === detailId);
            if (detail) { detail[field] = value; saveToCloud(); }
        }
        window.addDailyDetail = function(dayId) {
            if(!isEditor) return;
            ITINERARY_DATA.find(d => d.day === dayId)?.details.push({ id: Date.now(), time: "00:00", action: "新行程", type: "activity", location: "" });
            saveToCloud(); renderDaily();
            document.getElementById(`day-content-${dayId}`).classList.remove('hidden');
        }
        window.removeDailyDetail = function(dayId, detailId) {
            if(!isEditor || !confirm('刪除此行程？')) return;
            const day = ITINERARY_DATA.find(d => d.day === dayId);
            day.details = day.details.filter(d => d.id !== detailId);
            saveToCloud(); renderDaily();
            document.getElementById(`day-content-${dayId}`).classList.remove('hidden');
        }

            if(!isEditor) return;
            const item = budgetItems.find(i => i.id === id);
            if(item) {
                item[field] = field === 'amount' ? Number(value) : value;
                saveToCloud();
                if(field === 'amount') {

        }
        window.addAdvisoryItem = function(type) {
            if(!isEditor) return;
            (type === 'outfit' ? OUTFIT_TIPS : DRIVE_TIPS).push({ id: Date.now(), text: "編輯新建議..." });
            saveToCloud(); renderAdvisories();
        }
        window.removeAdvisory = function(type, id) {
            if(!isEditor) return;
            if(type === 'outfit') OUTFIT_TIPS = OUTFIT_TIPS.filter(i => i.id !== id);
            else DRIVE_TIPS = DRIVE_TIPS.filter(i => i.id !== id);
            saveToCloud(); renderAdvisories();
        }

        // --- RENDERERS ---
        function renderAll() {
            renderDaily();
            renderMapCodes();
            renderBudget();
            renderAdvisories();
            applyRoleUI();
            lucide.createIcons();
        }

        function renderDaily() {
            const container = document.getElementById('daily-container');
            if(!container) return;
            
            const editAttr = isEditor ? 'contenteditable="true"' : '';
            
            container.innerHTML = ITINERARY_DATA.map(day => `
                <div class="glass-card rounded-2xl overflow-hidden transition-all border border-slate-100 hover:border-theme-300">
                    <div onclick="toggleDay(${day.day})" class="flex flex-col md:flex-row md:items-center p-5 bg-white/50 cursor-pointer hover:bg-theme-50/50 select-none">
                        <div class="flex items-center gap-5 flex-1">
                            <div class="bg-theme-600 text-white w-14 h-14 rounded-2xl flex flex-col items-center justify-center shrink-0 shadow-md">
                                <span class="text-[10px] font-bold uppercase tracking-wider opacity-80">Day</span>
                                <span class="text-2xl font-black leading-none">${day.day}</span>
                            </div>
                            <div>
                                <h3 class="font-black text-xl text-slate-800">${day.title}</h3>
                                <div class="flex items-center gap-3 text-sm font-bold text-slate-500 mt-1.5">
                                    <span>${day.date}</span>
                                    <span class="flex items-center gap-1"><i data-lucide="map-pin" width="14"></i> ${day.city}</span>
                                    <span class="flex items-center gap-1 bg-white/80 px-2.5 py-0.5 rounded-full text-slate-600 border border-slate-200 shadow-sm"><i data-lucide="${day.icon}" width="12"></i> ${day.weather}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 mt-3 md:mt-0 justify-between md:justify-end w-full md:w-auto">
                            <div class="text-right hidden md:block">
                                <div class="text-xs font-bold text-slate-400">STAY</div>
                                <div class="text-sm font-bold text-slate-700 truncate max-w-[160px]">${day.stay}</div>
                            </div>
                            <div class="text-slate-400 bg-slate-100 p-2 rounded-full"><i data-lucide="chevron-down" width="20"></i></div>
                        </div>
                    </div>
                    
                    <div id="day-content-${day.day}" class="hidden p-6 bg-white/60 border-t border-slate-100">
                        <div class="relative ml-2 space-y-8 py-2">
                            ${day.details.map(detail => {
                                const colorClass = detail.type === 'transport' ? 'bg-slate-400' : detail.type === 'food' ? 'bg-orange-400' : detail.type === 'shopping' ? 'bg-pink-400' : 'bg-theme-500';
                                return `
                                <div class="timeline-item relative group hover:bg-white/80 p-3 rounded-2xl -ml-3 transition-colors">
                                    <div class="timeline-line"></div>
                                    <div class="absolute -left-[17px] top-4 w-3.5 h-3.5 rounded-full border-2 border-white shadow-sm z-10 ${colorClass}"></div>
                                    <div class="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-5 w-full pl-6">
                                        <div ${editAttr} onblur="updateDailyDetail(${day.day}, ${detail.id}, 'time', this.innerText)" class="font-mono text-sm font-black text-slate-500 w-12 shrink-0 pt-0.5">${detail.time}</div>
                                        <div class="flex-1 w-full">
                                            <div ${editAttr} onblur="updateDailyDetail(${day.day}, ${detail.id}, 'action', this.innerText)" class="font-bold text-slate-800 text-[15px]">${detail.action}</div>
                                            <div class="flex items-center gap-2 mt-2">
                                                <button onclick="event.stopPropagation(); openGoogleMaps('${detail.location || ''}')" class="text-xs text-blue-600 hover:text-white flex items-center gap-1 font-bold bg-blue-50 hover:bg-blue-500 px-2 py-1 rounded-lg border border-blue-100 transition-colors shadow-sm">
                                                    <i data-lucide="map-pin" width="12"></i> ${detail.location ? '導航' : '無座標'}
                                                </button>
                                                <div ${editAttr} onblur="updateDailyDetail(${day.day}, ${detail.id}, 'location', this.innerText)" class="text-xs font-medium text-slate-400 hover:text-slate-600 min-w-[50px] truncate max-w-[200px]" title="${detail.location || ''}">${detail.location || (isEditor ? '新增座標地點...' : '')}</div>
                                            </div>
                                        </div>
                                        ${isEditor ? `<button onclick="removeDailyDetail(${day.day}, ${detail.id})" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition-opacity p-2 bg-slate-50 rounded-full hover:bg-rose-50"><i data-lucide="trash-2" width="16"></i></button>` : ''}
                                    </div>
                                </div>`
                            }).join('')}
                        </div>
                        ${isEditor ? `<button onclick="addDailyDetail(${day.day})" class="ml-5 mt-6 text-sm text-theme-600 hover:text-theme-800 flex items-center gap-1 font-bold px-4 py-2 bg-white rounded-full border border-theme-100 shadow-sm hover:shadow transition-all"><i data-lucide="plus" width="16"></i> 新增行程區塊</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderMapCodes() {
            const container = document.getElementById('mapcode-grid');
            if(!container) return;
            container.innerHTML = Object.entries(MAP_CODES).map(([name, code]) => `
                <div class="flex flex-col justify-between bg-white/80 p-4 rounded-2xl border border-slate-100 shadow-sm gap-3 hover:shadow-md transition-shadow">
                    <button onclick="openGoogleMaps('${name}')" class="font-bold text-slate-700 hover:text-theme-600 flex items-start gap-2 text-left">
                        <i data-lucide="map-pin" width="18" class="shrink-0 mt-0.5 text-theme-500"></i> <span class="leading-tight">${name}</span>
                    </button>
                    <div class="flex justify-end">
                        <code class="bg-slate-100 px-3 py-1.5 rounded-lg text-slate-600 font-mono font-bold select-all cursor-pointer hover:bg-slate-200 text-xs shadow-inner">${code}</code>
                    </div>
                </div>
            `).join('');
        }

        function renderBudget() {
            const tbody = document.getElementById('budget-tbody');
            if(!tbody) return;
            const inputAttr = isEditor ? '' : 'disabled';
            const trHoverClass = isEditor ? 'hover:bg-slate-50' : '';
            
            tbody.innerHTML = budgetItems.map(item => `
                <tr class="border-b border-slate-100 ${trHoverClass} group transition-colors">
                    <td class="py-3 pl-6"><input type="text" value="${item.category}" onchange="updateBudget(${item.id}, 'category', this.value)" ${inputAttr} class="w-full bg-transparent font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-theme-300 rounded px-2 py-1 ${!isEditor && 'cursor-default'}"></td>
                    <td class="py-3"><input type="number" value="${item.amount}" onchange="updateBudget(${item.id}, 'amount', this.value)" ${inputAttr} class="w-full bg-transparent font-mono font-bold text-slate-800 text-right focus:outline-none focus:ring-2 focus:ring-theme-300 rounded px-2 py-1 ${!isEditor && 'cursor-default'}"></td>
                    <td class="py-3"><input type="text" value="${item.note}" onchange="updateBudget(${item.id}, 'note', this.value)" ${inputAttr} class="w-full bg-transparent font-medium text-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-theme-300 rounded px-2 py-1 ${!isEditor && 'cursor-default'}"></td>
                    <td class="py-3 text-center">
                        ${isEditor ? `<button onclick="removeBudget(${item.id})" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity p-1.5 hover:bg-rose-50 rounded-full"><i data-lucide="x" width="16"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
            
            const total = budgetItems.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
            document.getElementById('budget-total').innerText = 'NT$ ' + total.toLocaleString();
            document.getElementById('overview-budget-total').innerText = 'NT$ ' + total.toLocaleString();
        }

        function renderAdvisories() {
            const outfitList = document.getElementById('outfit-list');
            const driveList = document.getElementById('drive-list');
            const editAttr = isEditor ? 'contenteditable="true"' : '';
            
            const createLi = (item, type) => `
                <li class="flex gap-3 group bg-white/60 p-3 rounded-xl border border-slate-100 shadow-sm">
                    <span class="${type === 'outfit' ? 'text-orange-400' : 'text-theme-500'} font-black shrink-0 mt-0.5">•</span>
                    <span ${editAttr} onblur="updateAdvisory('${type}', ${item.id}, this.innerHTML)" class="flex-1 text-slate-600 leading-relaxed">${item.text}</span>
                    ${isEditor ? `<button onclick="removeAdvisory('${type}', ${item.id})" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-rose-500 transition-opacity p-1 self-start"><i data-lucide="x" width="16"></i></button>` : ''}
                </li>`;

            if(outfitList) outfitList.innerHTML = OUTFIT_TIPS.map(i => createLi(i, 'outfit')).join('');
            if(driveList) driveList.innerHTML = DRIVE_TIPS.map(i => createLi(i, 'drive')).join('');
        }

        function initChart() {
            const ctx = document.getElementById('tempChart');
            if(!ctx) return;
            new Chart(ctx.getContext('2d'), { 
                type: 'line', 
                data: { 
                    labels: ['早晨', '中午', '傍晚', '深夜'], 
                    datasets: [
                        { label: '名古屋市區 (Nagoya)', data: [25, 35, 29, 26], borderColor: '#f97316', backgroundColor: '#ffedd5', borderWidth: 3, tension: 0.4, fill: true }, 
                        { label: '新穗高/上高地 (Mountains)', data: [15, 22, 18, 12], borderColor: '#0d9488', backgroundColor: '#ccfbf1', borderWidth: 3, tension: 0.4, fill: true }
                    ] 
                }, 
                options: { 
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { font: { family: "'Noto Sans TC', sans-serif", weight: 'bold' } } } },
                    scales: { 
                        y: { grid: { color: '#f1f5f9' }, ticks: { font: { weight: 'bold' } } },
                        x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } }
                    }
                } 
            });
        }

        // --- DOM Ready ---
        document.addEventListener('DOMContentLoaded', () => {
            renderMapCodes(); // Static render first
            lucide.createIcons();
            initChart();
        });
    </script>
</body>
</html>
